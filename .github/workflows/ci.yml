name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: presidium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - run: pip install poetry==2.4.1
      - run: poetry check --lock
      - run: poetry install --with dev --no-interaction
      - name: Check syntax and undefined names
        run: poetry run ruff check presidium tests --select E9,F63,F7,F82
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - run: npm run build:argon --prefix web
      - run: poetry run pytest tests -q --tb=short --timeout=30
        env:
          QT_QPA_PLATFORM: offscreen
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presidium/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: presidium/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:argon
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start isolated test homeserver
        run: docker compose up -d tuwunel
        working-directory: presidium
      - name: Wait for Matrix readiness
        run: |
          node --input-type=module -e "for(let i=0;i<90;i++){try{if((await fetch('http://localhost:8008/_matrix/client/versions')).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - run: pip install poetry==2.4.1
      - run: poetry install --only main --no-interaction
        working-directory: presidium
      - name: Start integrated API
        working-directory: presidium
        run: |
          mkdir -p .cache
          nohup poetry run uvicorn presidium.api:app --host 127.0.0.1 --port 8000 > .cache/api-ci.log 2>&1 &
        env:
          COMMISSIONKA_SANDBOX_ORDERS: '1'
          COMMISSIONKA_VAT_MODE: none
          COMMISSIONKA_DELIVERY_KOPECKS: '0'
          COMMISSIONKA_PAYMENT_OPERATOR_KOPECKS: '0'
          PRESIDIUM_MODERATOR_IDS: '@integration_moderator68:presidium.local'
      - name: Wait for API
        run: node --input-type=module -e "for(let i=0;i<60;i++){try{if((await fetch('http://127.0.0.1:8000/health')).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: presidium/.cache/original-frontend-tests
  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t presidium:test presidium
      - name: Verify runtime imports and default command override
        run: docker run --rm -e QT_QPA_PLATFORM=offscreen presidium:test python -c "import presidium.api; import presidium.ui.app; print('OK')"
