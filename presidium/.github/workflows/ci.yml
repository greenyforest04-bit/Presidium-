name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linting tools
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check presidium/ tests/
      - name: Ruff format check
        run: ruff format --check presidium/ tests/
      - name: MyPy type check
        run: mypy presidium/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        run: poetry run pytest tests/ -v --tb=short --timeout=30
        env:
          QT_QPA_PLATFORM: offscreen

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t presidium:latest .
      - name: Verify image
        run: docker run --rm presidium:latest python -c "import presidium; print('OK')"
