[tool.poetry]
name = "presidium"
version = "0.1.0"
description = "Decentralized end-to-end encrypted P2P messenger"
authors = ["Presidium Contributors"]
license = "MIT"
readme = "README.md"
packages = [{include = "presidium"}]

[tool.poetry.dependencies]
python = "^3.11"
PySide6 = "^6.7"
cryptography = "^43.0"
argon2-cffi = "^23.1"
aiosqlite = "^0.20"
aiofiles = "^24.1"
aiortc = "^1.9"
Pillow = "^10.4"
msgspec = "^0.18"
pydantic = "^2.9"
pydantic-settings = "^2.5"
qasync = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
mypy = "^1.11"
ruff = "^0.6"

[tool.poetry.scripts]
presidium = "presidium.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501", "A003"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
