[tool.poetry]
name = "presidium"
version = "1.5.0"
description = "Decentralized end-to-end encrypted P2P messenger"
authors = ["Presidium Contributors"]
license = "MIT"
readme = "README.md"
packages = [{include = "presidium"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
PySide6 = "^6.7"
cryptography = "^43.0"
argon2-cffi = "^23.1"
aiosqlite = "^0.20"
aiofiles = "^24.1"
aiortc = "^1.9"
aiohttp = "^3.10"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
Pillow = "^10.4"
msgspec = "^0.18"
pydantic = "^2.9"
pydantic-settings = "^2.5"
qasync = "^0.27"
psutil = "^6.0"
qrcode = {version = "^8.0", extras = ["pil"]}
pyzbar = {version = "^0.1", optional = true}
typer = {version = "^0.12", optional = true}
rich = {version = "^13.0", optional = true}
pytest-benchmark = {version = "^4.0", optional = true}
hypothesis = {version = "^6.0", optional = true}
sentence-transformers = {version = "^3.0", optional = true}
faiss-cpu = {version = "^1.8", optional = true}
numpy = {version = "^1.26", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
pytest-timeout = "^2.3"
pytest-benchmark = "^4.0"
hypothesis = "^6.0"
mypy = "^1.11"
ruff = "^0.6"
typer = "^0.12"
rich = "^13.0"

[tool.poetry.scripts]
presidium = "presidium.main:main"
presidium-admin = "presidium.cli:main"
presidium-push-relay = "presidium.push.relay_server:main"

[tool.poetry.extras]
qr-decode = ["pyzbar"]
cli = ["typer", "rich"]
bench = ["pytest-benchmark", "hypothesis"]
semantic-search = ["sentence-transformers", "faiss-cpu", "numpy"]
all = ["pyzbar", "typer", "rich", "sentence-transformers", "faiss-cpu", "numpy"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501", "A003"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
