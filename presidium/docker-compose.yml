services:
  postgres:
    profiles: ["storage"]
    image: postgres:16-alpine
    container_name: presidium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: presidium
      POSTGRES_USER: presidium
      POSTGRES_PASSWORD: ${PRESIDIUM_POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presidium -d presidium"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - presidium

  minio:
    profiles: ["media"]
    image: minio/minio:latest
    container_name: presidium-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: presidium
      MINIO_ROOT_PASSWORD: ${PRESIDIUM_MINIO_PASSWORD:-}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presidium

  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel@sha256:678b7f5350e06a41614444497c587da9dddf66767e4068a27480402f3c1367d0
    container_name: presidium-tuwunel
    restart: unless-stopped
    ports:
      - "127.0.0.1:8008:8008"
    volumes:
      - tuwunel_data:/var/lib/tuwunel
      - ./docker/tuwunel/tuwunel.toml:/etc/tuwunel/tuwunel.toml:ro
    command: ["-c", "/etc/tuwunel/tuwunel.toml"]
    networks:
      - presidium
    healthcheck:
      test: ["CMD", "tuwunel", "-c", "/etc/tuwunel/tuwunel.toml", "--health-check"]
      interval: 15s
      timeout: 5s
      retries: 20

  presidium-api:
    profiles: ["api"]
    build: .
    container_name: presidium-api
    working_dir: /app
    command: ["python", "-m", "presidium.api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
    environment:
      PRESIDIUM_MATRIX_HOMESERVER_URL: http://tuwunel:8008
      PRESIDIUM_LOG_LEVEL: INFO
      PRESIDIUM_PRODUCT_DATA_DIR: /data/presidium/product
      PRESIDIUM_MATRIX_PUBLIC_URL: http://localhost:8008
      COMMISSIONKA_SANDBOX_ORDERS: ${COMMISSIONKA_SANDBOX_ORDERS:-0}
      COMMISSIONKA_VAT_MODE: ${COMMISSIONKA_VAT_MODE:-none}
      COMMISSIONKA_DELIVERY_KOPECKS: ${COMMISSIONKA_DELIVERY_KOPECKS:-0}
      COMMISSIONKA_PAYMENT_OPERATOR_KOPECKS: ${COMMISSIONKA_PAYMENT_OPERATOR_KOPECKS:-0}
      PRESIDIUM_MODERATOR_IDS: ${PRESIDIUM_MODERATOR_IDS:-}
      PRESIDIUM_BILLING_WEBHOOK_SECRET: ${PRESIDIUM_BILLING_WEBHOOK_SECRET:-}
      CAPSULE_AGENT_URL: ${CAPSULE_AGENT_URL:-}
      CAPSULE_AGENT_TOKEN: ${CAPSULE_AGENT_TOKEN:-}
    volumes:
      - product_data:/data/presidium/product
    depends_on:
      tuwunel:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - presidium

  presidium-web:
    profiles: ["web"]
    image: node:24-alpine
    container_name: presidium-web
    working_dir: /app
    volumes:
      - ./web:/app
      - ./argon:/argon:ro
      - web_node_modules:/app/node_modules
    command: sh -lc "npm ci && node node_modules/next/dist/bin/next dev --hostname 0.0.0.0 --port 5173 --webpack"
    environment:
      PRESIDIUM_MATRIX_PROXY_URL: http://tuwunel:8008
      PRESIDIUM_API_PROXY_URL: http://presidium-api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      presidium-api:
        condition: service_healthy
      tuwunel:
        condition: service_healthy
    networks:
      - presidium

volumes:
  product_data:
  web_node_modules:
  postgres_data:
  minio_data:
  tuwunel_data:

networks:
  presidium:
    driver: bridge
