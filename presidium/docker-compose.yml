services:
  postgres:
    image: postgres:16-alpine
    container_name: presidium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: presidium
      POSTGRES_USER: presidium
      POSTGRES_PASSWORD: presidium_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presidium -d presidium"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - presidium

  minio:
    profiles: ["media"]
    image: minio/minio:latest
    container_name: presidium-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: presidium
      MINIO_ROOT_PASSWORD: presidium_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presidium

  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel:latest
    container_name: presidium-tuwunel
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      - tuwunel_data:/var/lib/tuwunel
      - ./docker/tuwunel/tuwunel.toml:/etc/tuwunel/tuwunel.toml:ro
    command: ["-c", "/etc/tuwunel/tuwunel.toml"]
    networks:
      - presidium
    healthcheck:
      test: ["CMD", "tuwunel", "--health-check"]
      interval: 15s
      timeout: 5s
      retries: 20

  presidium-api:
    profiles: ["api"]
    build: .
    container_name: presidium-api
    working_dir: /app
    command: python -m presidium.api
    environment:
      PRESIDIUM_MATRIX_HOMESERVER_URL: http://tuwunel:8008
      PRESIDIUM_DATABASE_URL: postgresql://presidium:presidium_dev_password@postgres:5432/presidium
      PRESIDIUM_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      tuwunel:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - presidium

  presidium-web:
    profiles: ["web"]
    image: node:22-alpine
    container_name: presidium-web
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_MATRIX_HOMESERVER_URL: http://localhost:8008
    ports:
      - "5173:5173"
    depends_on:
      tuwunel:
        condition: service_healthy
    networks:
      - presidium

volumes:
  postgres_data:
  minio_data:
  tuwunel_data:

networks:
  presidium:
    driver: bridge
